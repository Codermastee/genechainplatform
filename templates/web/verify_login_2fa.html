<html>
<head>
    <title>GeneNFT | 2FA Verification</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .verify-container {
            width: 100%;
            max-width: 400px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .icon-shield {
            font-size: 50px;
            color: #38bdf8;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
        }
        h2 { margin-bottom: 10px; font-weight: 600; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 30px; }
        
        .otp-input {
            width: 100%;
            padding: 15px;
            background: rgba(15, 23, 42, 0.5);
            border: 2px solid #334155;
            border-radius: 12px;
            color: white;
            font-size: 24px;
            letter-spacing: 8px;
            text-align: center;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        .otp-input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.1);
        }
        
        .btn-verify {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #0ea5e9, #2563eb);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-verify:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
        }
        
        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        
        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #64748b;
            text-decoration: none;
            font-size: 13px;
            transition: 0.2s;
        }
        .back-link:hover { color: #94a3b8; }
    </style>
</head>
<body>
    <div class="verify-container">
        <div class="icon-shield">
            <i class="fa fa-shield-halved"></i>
        </div>
        <h2>Two-Factor Auth</h2>
        <p>Please enter the 6-digit verification code from your Google Authenticator app to continue.</p>
        
        {% if msg == 'fail' %}
            <div class="error-msg">
                <i class="fa fa-circle-exclamation"></i> Invalid code. Please try again.
            </div>
        {% endif %}
        
        <form method="POST">
            <input type="text" name="code" class="otp-input" placeholder="000000" maxlength="6" required autofocus>
            <button type="submit" class="btn-verify">Verify and Login</button>
        </form>
        
        <a href="/login" class="back-link">Cancel and back to login</a>
    </div>
</body>
</html>
